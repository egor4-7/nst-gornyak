<!-- Верхняя карточка (обложка) с погодой и кнопкой перехода -->
<div class="bg-emerald-900 text-white rounded-3xl p-5 shadow-xl mb-6 relative overflow-hidden">
  <!-- Заголовок портала внутри карточки -->
  <div class="mb-4">
    <h1 class="text-xl font-extrabold tracking-tight">НСТ «Горняк»</h1>
    <p class="text-xs text-emerald-200">Информационный портал для садовод</p>
  </div>

  <!-- Виджет погоды -->
  <div class="bg-emerald-800/60 backdrop-blur rounded-2xl p-4 mb-4 border border-emerald-700/50">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-sun text-yellow-400 text-3xl"></i>
        <div>
          <div class="text-2xl font-bold">+10°C</div>
          <div class="text-xs text-emerald-200">Сегодня: Солнечно</div>
        </div>
      </div>
    </div>
    <div class="text-[11px] text-emerald-300 mb-3">
      Завтра: переменная облачность, +12°
    </div>
    <!-- Рассвет / Закат -->
    <div class="flex items-center justify-between pt-2 border-t border-emerald-700/40 text-xs text-emerald-200">
      <span>Рассвет: 07:24</span>
      <span>Закат: 17:16</span>
    </div>
  </div>

  <!-- Кнопка перехода на полноценную версию -->
  <div class="flex items-center gap-3">
    <a href="father.html" class="flex-1 py-3 px-4 rounded-2xl bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold text-sm flex items-center justify-center gap-2 shadow-lg transition">
      <i class="fa-solid fa-desktop"></i>
      <span>Полноценная версия</span>
    </a>
    
    <!-- Кнопка колокольчика (уведомления) -->
    <button onclick="openNotifModal()" class="w-12 h-12 rounded-2xl bg-emerald-800/80 hover:bg-emerald-700 border border-emerald-700/50 flex items-center justify-center text-white relative shadow transition">
      <i class="fa-solid fa-bell text-base"></i>
      <!-- Live счетчик -->
      <span id="notifBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-emerald-900">1</span>
    </button>
  </div>
</div>
