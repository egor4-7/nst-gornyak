<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НСТ «Горняк» — Официальный портал</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #e2ede3;
        }
        .forest-banner {
            background:
                linear-gradient(135deg, rgba(20, 60, 35, 0.85), rgba(35, 107, 67, 0.8)),
                url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?auto=format&fit=crop&w=1600&q=80') center/cover;
        }
        .portal-card {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .portal-card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 16px 30px -5px rgba(35, 107, 67, 0.2);
        }
        .portal-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transform: rotate(30deg) translateX(-100%);
            transition: transform 0.7s ease-in-out;
        }
        .portal-card:hover::after {
            transform: rotate(30deg) translateX(100%);
        }
    </style>
</head>
<body class="min-h-screen py-6 px-3 sm:px-6 flex flex-col items-center">

    <div class="w-full max-w-6xl mx-auto flex flex-col gap-6">

        <div class="forest-banner w-full rounded-3xl p-6 sm:p-9 text-white shadow-xl relative flex flex-col md:flex-row justify-between items-center gap-6 border border-white/20">
            <div class="flex flex-col gap-1 text-center md:text-left">
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight">НСТ «Горняк»</h1>
                <p class="text-green-100 text-sm sm:text-base font-medium opacity-90">Официальный портал садового товарищества</p>
            </div>

            <div class="flex items-center gap-3 bg-black/30 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/20">
                <div class="flex items-center gap-2 text-yellow-300 pr-3 border-r border-white/20">
                    <i class="fa-solid fa-sun text-xl"></i>
                    <span class="text-white font-bold text-lg">+5°C</span>
                    <span class="text-xs text-green-100 opacity-80">Солнечно</span>
                </div>
                <a href="father.html" title="Перейти на папин портал" class="w-10 h-10 rounded-xl bg-white/20 hover:bg-white/30 flex items-center justify-center transition active:scale-95 text-white">
                    <i class="fa-solid fa-right-left text-base"></i>
                </a>
                <button type="button" onclick="alert('Уведомлений нет')" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center transition text-white" aria-label="Уведомления">
                    <i class="fa-solid fa-bell text-base"></i>
                </button>
            </div>
        </div>

        <div class="relative w-full">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-5 text-green-700 text-lg"></i>
                <input type="text" id="searchInput" placeholder="Умный поиск по сайту и документам..."
                    class="w-full bg-white/95 backdrop-blur border border-green-300 rounded-2xl py-4 pl-14 pr-4 text-gray-800 placeholder-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#236b43] transition text-base">
            </div>
            <div id="searchDropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-green-200 z-50 overflow-hidden">
                <div class="p-3 text-xs font-bold text-gray-400 uppercase bg-green-50">Быстрые результаты</div>
                <div class="flex flex-col py-1">
                    <button type="button" onclick="openSection('Транспорт', 'Расписание автобуса №105: 07:30, 12:00, 17:30')" class="px-5 py-3 text-left text-sm text-gray-700 hover:bg-green-100 flex items-center gap-3"><i class="fa-solid fa-bus text-[#236b43]"></i> Расписание автобусов</button>
                    <button type="button" onclick="openSection('Тарифы', 'Свет: 4.85 руб/кВт. Членские взносы: 1200 руб/сотка.')" class="px-5 py-3 text-left text-sm text-gray-700 hover:bg-green-100 flex items-center gap-3"><i class="fa-solid fa-bolt text-amber-500"></i> Тарифы и взносы</button>
                    <button type="button" onclick="openSection('Документы', 'Устав НСТ, реквизиты, бланки заявлений.')" class="px-5 py-3 text-left text-sm text-gray-700 hover:bg-green-100 flex items-center gap-3"><i class="fa-solid fa-folder-open text-[#236b43]"></i> Документы и реквизиты</button>
                    <button type="button" onclick="openSection('Контакты', 'Председатель: +7 (900) 000-00-00, Электрик: +7 (900) 111-22-33')" class="px-5 py-3 text-left text-sm text-gray-700 hover:bg-green-100 flex items-center gap-3"><i class="fa-solid fa-phone text-purple-600"></i> Телефоны служб</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">

            <!-- Карточка 1: Транспорт -->
            <button type="button" onclick="openSection('Транспорт', 'Расписание автобусов:\n• Из города: 07:30, 12:00, 17:30\n• Из НСТ: 08:30, 13:00, 18:30')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-[#2d8a56] flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-bus"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">Транспорт</h3>
                    <p class="text-xs text-gray-500">Расписание и маршруты</p>
                </div>
            </button>

            <!-- Карточка 2: Тарифы -->
            <button type="button" onclick="openSection('Тарифы', 'Текущие тарифы:\n• Электроэнергия: 4.85 руб/кВт⋅ч\n• Взнос: 1200 руб. с сотки в год')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">Тарифы</h3>
                    <p class="text-xs text-gray-500">Свет, вода, услуги</p>
                </div>
            </button>

            <!-- Карточка 3: Новости -->
            <button type="button" onclick="openSection('Новости', 'Объявление:\n15 числа состоится общее собрание членов НСТ.')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-newspaper"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">Новости</h3>
                    <p class="text-xs text-gray-500">Важные объявления</p>
                </div>
            </button>

            <!-- Карточка 4: Документы -->
            <button type="button" onclick="openSection('Документы', 'Доступны:\n• Устав НСТ\n• Реквизиты для оплаты\n• Бланки заявлений')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-[#2d8a56] flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">Документы</h3>
                    <p class="text-xs text-gray-500">Акты, уставы, бланки</p>
                </div>
            </button>

            <!-- Карточка 5: Контакты -->
            <button type="button" onclick="openSection('Контакты', 'Телефоны:\n• Председатель: +7 (900) 123-45-67\n• Электрик: +7 (900) 765-43-21')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-purple-50 text-purple-600 flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-address-book"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">Контакты</h3>
                    <p class="text-xs text-gray-500">Правление и службы</p>
                </div>
            </button>

            <!-- Карточка 6: Профиль -->
            <button type="button" onclick="openSection('Профиль', 'Участок №42\nЛицевой счет: 883920\nЗадолженностей нет.')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-sky-50 text-sky-600 flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">Профиль</h3>
                    <p class="text-xs text-gray-500">Личный кабинет</p>
                </div>
            </button>

            <!-- Карточка 7: Взносы -->
            <button type="button" onclick="openSection('Взносы', 'Оплата онлайн через Сбербанк по реквизитам НСТ.')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-credit-card"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">Взносы</h3>
                    <p class="text-xs text-gray-500">Оплата и история</p>
                </div>
            </button>

            <!-- Карточка 8: О НСТ -->
            <button type="button" onclick="openSection('О НСТ', 'НСТ «Горняк» основано в 1985 г. На территории 320 участков.')" class="portal-card cursor-pointer text-left bg-white/95 rounded-3xl p-6 flex items-center gap-5 shadow-sm border border-green-200/70">
                <div class="w-14 h-14 rounded-2xl bg-emerald-50 text-[#2d8a56] flex items-center justify-center text-2xl shrink-0">
                    <i class="fa-solid fa-circle-info"></i>
                </div>
                <div class="flex flex-col">
                    <h3 class="font-bold text-gray-800 text-lg">О НСТ</h3>
                    <p class="text-xs text-gray-500">История и схема</p>
                </div>
            </button>

        </div>

    </div>

    <div id="modalWindow" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-800"></h2>
                <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center" aria-label="Закрыть">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modalContent" class="text-gray-700 text-sm whitespace-pre-line py-2"></div>
            <p class="text-xs text-amber-700 bg-amber-50 rounded-lg px-3 py-2">Демонстрационные данные — уточняйте актуальную информацию у правления НСТ.</p>
            <button type="button" onclick="closeModal()" class="w-full py-3 bg-[#236b43] text-white rounded-xl font-bold hover:bg-[#1a5233] transition">
                Закрыть
            </button>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchDropdown = document.getElementById('searchDropdown');
        const modalWindow = document.getElementById('modalWindow');

        searchInput.addEventListener('focus', () => searchDropdown.classList.remove('hidden'));

        searchInput.addEventListener('input', () => {
            searchDropdown.classList.remove('hidden');
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
                searchDropdown.classList.add('hidden');
            }
        });

        function openSection(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').textContent = text;
            modalWindow.classList.remove('hidden');
            modalWindow.classList.add('flex');
            searchDropdown.classList.add('hidden');
        }

        function closeModal() {
            modalWindow.classList.add('hidden');
            modalWindow.classList.remove('flex');
        }

        modalWindow.addEventListener('click', (event) => {
            if (event.target === modalWindow) closeModal();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
